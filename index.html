 <html>
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
        
        <title>Pesquisa por CEP</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <link rel="stylesheet" href="./styles.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    </head>

    <script src="./index.js" defer></script>
    

    <body>
        <div id="main">
            <div id="conteudo">

                <h1>Insira seu CEP</h1>
                <form id="meuFormulario">
                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input name="cep" type="text" id="cep" maxlength="9" onblur="pesquisacep(this.value);" />
                    </div>

                    <div class="form-group">
                        <label for="rua">Rua</label>
                        <input name="rua" type="text" id="rua" />
                    </div>

                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input name="bairro" type="text" id="bairro" />
                    </div>

                    <div class="form-group-row">
                        <div class="form-group flex-2">
                        <label for="cidade">Cidade</label>
                        <input name="cidade" type="text" id="cidade" />
                        </div>

                        <div class="form-group flex-1">
                        <label for="uf">Estado (UF)</label>
                        <input name="uf" type="text" id="uf" maxlength="2" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="ibge">IBGE</label>
                        <input name="ibge" type="text" id="ibge" />
                    </div>

                    <button type="submit" id="btnFormmulario">Enviar</button>
                </form>
            </div>
        </div>
        <button id="theme_page">Modo Escuro</button>  
    </body>

    </html>
